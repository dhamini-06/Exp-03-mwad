
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <div>
            <h1>TaskFlow</h1>
            <p>Organize your day, achieve your goals.</p>
        </div>
        <button id="themeBtn">☀️</button>
    </header>

    <div class="welcome">
        <h2>My Tasks</h2>
        <p>Stay productive and manage your work efficiently.</p>
    </div>

    <div class="stats">

        <div class="stat-card">
            <h3>Total Tasks</h3>
            <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
            <h3>Completed</h3>
            <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat-card">
            <h3>Pending</h3>
            <h2 id="pendingTasks">0</h2>
        </div>

    </div>

    <div class="progress-box">
        <div class="progress-heading">
            <h3>Daily Progress</h3>
            <span id="progressText">0%</span>
        </div>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>
    </div>

    <div class="task-form">

        <h3>Add New Task</h3>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to do?"
            >

            <input type="date" id="dueDate">

            <select id="priority">
                <option value="High">High Priority</option>
                <option value="Medium" selected>Medium Priority</option>
                <option value="Low">Low Priority</option>
            </select>

            <button id="addBtn">+ Add Task</button>

        </div>

    </div>

    <div class="task-heading">

        <h3>Your Tasks</h3>

        <div class="filter-section">

            <button class="filter-btn active"
                    data-filter="all">All</button>

            <button class="filter-btn"
                    data-filter="pending">Pending</button>

            <button class="filter-btn"
                    data-filter="completed">Completed</button>

        </div>

    </div>

    <ul id="taskList"></ul>

    <p id="emptyMessage">No tasks found. Add a new task!</p>

</div>

<script src="script.js"></script>

</body>
</html>
